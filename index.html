<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azimuth Rim</title>
<meta name="description" content="Azimuth Rim">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23ff6a00'/%3E%3Cpath d='M84 46 A16 16 0 0 1 116 46 L116 100 L136 100 L136 72 A12 12 0 0 1 160 72 L160 124 L116 124 L116 176 L84 176 L84 146 L40 146 L40 92 A12 12 0 0 1 64 92 L64 122 L84 122 Z' fill='none' stroke='%230a0a0a' stroke-width='9' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Panchang';src:url(Panchang-Variable.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Work Sans';src:url(WorkSans-Variable.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#ffffff}
a{color:#0a0a0a}a:hover{color:#0a3a8c}
.page{max-width:1280px;margin:0 auto;padding:32px 32px 48px 32px;background:#ffffff;color:#0a0a0a;font-family:'Work Sans',system-ui,sans-serif;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:row;justify-content:space-between;align-items:flex-start;gap:16px}
.left{width:fit-content;display:flex;flex-direction:column}
.mast{margin:0;font-family:'Panchang','Work Sans',system-ui,sans-serif;font-weight:800;font-style:italic;font-size:126px;line-height:0.8;letter-spacing:-0.05em;text-transform:uppercase;color:#0a0a0a;padding-top:12px}
.art{width:0;min-width:100%;aspect-ratio:3 / 2;overflow:hidden;background:#0a3a8c;margin-top:236px}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 48%}
.badgebox{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.badge{width:72px;height:72px;background:#ff6a00;display:flex;align-items:center;justify-content:center}
.badge svg{width:84%;height:84%}
.badgebox span{font-size:11px;font-weight:600;letter-spacing:0.04em;color:#4a4a4a}
.caption{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.35;text-transform:uppercase;letter-spacing:0.01em}
.caption b{font-weight:800}
.caption .bar{color:#ff6a00;font-weight:800}
.foot{font-size:11px;font-weight:600;letter-spacing:0.04em;color:#4a4a4a;text-transform:uppercase}
@media (max-width:1100px){
  .mast{font-size:77px}
  .art{margin-top:24px}
}
@media (max-width:700px){
  .mast{font-size:39px}
  .art{margin-top:20px}
  .badge{width:48px;height:48px}
  .page{padding:20px 16px 32px 16px}
}
</style>
</head>
<body>
<main class="page">

<div class="top">
<div class="left">
<h1 class="mast">Azimuth<br>Rim</h1>
<div class="art">
<img src="hero.jpg" alt="Concentric blue and orange rings radiating from a small figure walking along a horizon line">
</div>
</div>
<div class="badgebox">
<div class="badge">
<svg viewBox="0 0 200 200" role="img" aria-label="Placeholder mark: outline of a saguaro cactus">
<path d="M84 46 A16 16 0 0 1 116 46 L116 100 L136 100 L136 72 A12 12 0 0 1 160 72 L160 124 L116 124 L116 176 L84 176 L84 146 L40 146 L40 92 A12 12 0 0 1 64 92 L64 122 L84 122 Z" fill="none" stroke="#0a0a0a" stroke-width="9" stroke-linejoin="round"/>
</svg>
</div>
<span>azimuthrim.com</span>
</div>
</div>

<div class="caption">
<div><b>I don't know what I'm doing&#8212;</b>but I'm doing it anyway.</div>
<div><b>[TBD]</b> <span class="bar">|</span> <b>[TBD]:</b> something else</div>
</div>

<div class="foot">&#169; 2026 Azimuth Rim</div>

</main>
</body>
</html>
